name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - name: Install latest npm
        run: npm install -g npm@latest
      - name: Validate release input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got $VERSION"
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          JSR_VERSION=$(node -p "require('./jsr.json').version")
          REVISION=$(node -e "const fs=require('node:fs'); const match=fs.readFileSync('src/index.ts','utf8').match(/REVISION = \\\"([^\\\"]+)\\\"/); console.log(match?.[1] ?? '')")
          if [ "$PACKAGE_VERSION" != "$VERSION" ] || [ "$JSR_VERSION" != "$VERSION" ] || [ "$REVISION" != "$VERSION" ]; then
            echo "::error::Version mismatch package=$PACKAGE_VERSION jsr=$JSR_VERSION revision=$REVISION input=$VERSION"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag already exists locally: v$VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag already exists remotely: v$VERSION"
            exit 1
          fi
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::npm version already exists: $PACKAGE_NAME@$VERSION"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - name: Publish npm package with provenance
        run: npm publish --provenance --access public
      - name: Publish JSR package
        run: bun run jsr:publish
      - name: Verify npm package provenance
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE=$(node -p "require('./package.json').name")
          VERIFY_DIR=$(mktemp -d)
          cd "$VERIFY_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE@$VERSION"
          npm audit signatures
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes "Release v$VERSION" --latest
