name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix
        required: true
        type: string

run-name: Release ${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_state.outputs.version }}
      package: ${{ steps.release_state.outputs.package }}
      candidate_sha: ${{ steps.release_state.outputs.candidate_sha }}
      npm_exists: ${{ steps.release_state.outputs.npm_exists }}
      jsr_exists: ${{ steps.release_state.outputs.jsr_exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Assert release source and version
        id: release_state
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "xsyetopz/easel.js" ]; then
            echo "::error::Release is only allowed for xsyetopz/easel.js (got $GITHUB_REPOSITORY)"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release must run from refs/heads/main (got $GITHUB_REF)"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got $VERSION"
            exit 1
          fi

          git fetch --no-tags --force origin main:refs/remotes/origin/main
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$HEAD_SHA" != "$MAIN_SHA" ] || [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release checkout is not the current main commit"
            echo "HEAD=$HEAD_SHA origin/main=$MAIN_SHA github.sha=$GITHUB_SHA"
            exit 1
          fi

          PACKAGE_VERSION="$(bun -p "require('./package.json').version")"
          PACKAGE_NAME="$(bun -p "require('./package.json').name")"
          JSR_NAME="$(bun -p "require('./jsr.json').name")"
          JSR_VERSION="$(bun -p "require('./jsr.json').version")"
          REVISION="$(sed -n 's/^export const REVISION = "\([^\"]*\)";$/\1/p' src/index.ts)"
          if [ "$PACKAGE_NAME" != "@xsyetopz/easel" ] || [ "$JSR_NAME" != "@xsyetopz/easel" ]; then
            echo "::error::Unexpected package identity: npm=$PACKAGE_NAME jsr=$JSR_NAME"
            exit 1
          fi
          if [ "$PACKAGE_VERSION" != "$VERSION" ] || [ "$JSR_VERSION" != "$VERSION" ] || [ "$REVISION" != "$VERSION" ]; then
            echo "::error::Version mismatch package=$PACKAGE_VERSION jsr=$JSR_VERSION revision=$REVISION input=$VERSION"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag already exists: v$VERSION"
            exit 1
          fi
          TAG_ERROR="$(mktemp)"
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" >/dev/null 2>"$TAG_ERROR"
          TAG_STATUS=$?
          set -e
          case "$TAG_STATUS" in
            0)
              echo "::error::Tag already exists remotely: v$VERSION"
              exit 1
              ;;
            2)
              ;;
            *)
              echo "::error::Unable to prove tag is absent"
              cat "$TAG_ERROR"
              exit 1
              ;;
          esac

          NPM_ERROR="$(mktemp)"
          NPM_METADATA="$(mktemp)"
          RELEASE_SHA="$HEAD_SHA"
          if npm view "$PACKAGE_NAME@$VERSION" --json >"$NPM_METADATA" 2>"$NPM_ERROR"; then
            NPM_EXISTS=true
            RELEASE_SHA="$(node - "$NPM_METADATA" "$VERSION" <<'NODE'
          const fs = require("node:fs");
          const [metadataPath, expectedVersion] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          const metadata = Array.isArray(payload) ? payload[0] : payload;
          if (metadata?.version !== expectedVersion) process.exit(1);
          if (metadata?.dist?.attestations?.provenance?.predicateType !== "https://slsa.dev/provenance/v1") process.exit(1);
          if (!/^[0-9a-f]{40}$/.test(metadata?.gitHead ?? "")) process.exit(1);
          process.stdout.write(metadata.gitHead);
          NODE
            )"
            if ! git merge-base --is-ancestor "$RELEASE_SHA" "$HEAD_SHA"; then
              echo "::error::Published npm source $RELEASE_SHA is not an ancestor of current main $HEAD_SHA"
              exit 1
            fi
            PUBLISHED_VERSION="$(git show "$RELEASE_SHA:package.json" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(value).version))')"
            if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
              echo "::error::Published npm source has package version $PUBLISHED_VERSION, expected $VERSION"
              exit 1
            fi
          elif grep -Eqi 'E404|404 Not Found|No match found for version|is not in this registry' "$NPM_ERROR"; then
            NPM_EXISTS=false
          else
            echo "::error::Unable to prove npm version is absent"
            cat "$NPM_ERROR"
            exit 1
          fi

          JSR_URL="https://api.jsr.io/scopes/xsyetopz/packages/easel/versions/$VERSION"
          JSR_RESPONSE="$(mktemp)"
          JSR_HTTP_STATUS="$(curl --silent --show-error --location --output "$JSR_RESPONSE" --write-out '%{http_code}' "$JSR_URL")"
          case "$JSR_HTTP_STATUS" in
            404)
              JSR_EXISTS=false
              ;;
            200)
              JSR_EXISTS=true
              ;;
            *)
              echo "::error::Unable to prove JSR version is absent (HTTP $JSR_HTTP_STATUS)"
              cat "$JSR_RESPONSE"
              exit 1
              ;;
          esac
          if [ "$JSR_EXISTS" = true ] && [ "$NPM_EXISTS" = false ]; then
            echo "::error::JSR exists without npm; unable to derive a shared release source"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "package=$PACKAGE_NAME"
            echo "candidate_sha=$RELEASE_SHA"
            echo "npm_exists=$NPM_EXISTS"
            echo "jsr_exists=$JSR_EXISTS"
          } >> "$GITHUB_OUTPUT"
      - name: Assert publishing toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.1"
          npm --version
          NPM_VERSION="$(npm --version)"
          node - "$NPM_VERSION" <<'NODE'
          const [major, minor, patch] = (process.argv[2] ?? "").split(".").map(Number);
          if ([major, minor, patch].some((value) => Number.isNaN(value))) {
            console.error("Unable to determine npm CLI version");
            process.exit(1);
          }
          if (major < 11 || (major === 11 && minor < 5)) {
            console.error(`npm ${major}.${minor}.${patch} is below trusted publishing minimum 11.5.1`);
            process.exit(1);
          }
          NODE
          test "$(bun --version)" = "1.3.14"
      - name: Install dependencies and run release gate
        run: bun run release:check
      - name: Build and dry-run JSR package
        run: |
          set -euo pipefail
          bun run jsr:build
          bunx jsr@0.14.3 publish --dry-run

  publish:
    name: Publish packages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.candidate_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Assert approved release candidate
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "xsyetopz/easel.js" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish job is not running on the protected release source"
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$CANDIDATE_SHA" ]; then
            echo "::error::Publish checkout does not match validated candidate"
            echo "HEAD=$HEAD_SHA candidate=$CANDIDATE_SHA"
            exit 1
          fi
          npm --version
          NPM_VERSION="$(npm --version)"
          node - "$NPM_VERSION" <<'NODE'
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 22 || (major === 22 && minor < 14)) {
            console.error(`Node ${process.versions.node} is below trusted publishing minimum 22.14.0`);
            process.exit(1);
          }
          const [npmMajor, npmMinor] = (process.argv[2] ?? "").split(".").map(Number);
          if (Number.isNaN(npmMajor) || Number.isNaN(npmMinor) || npmMajor < 11 || (npmMajor === 11 && npmMinor < 5)) {
            console.error(`npm ${process.argv[2] ?? "unknown"} is below trusted publishing minimum 11.5.1`);
            process.exit(1);
          }
          NODE
      - run: bun install --frozen-lockfile
      - name: Publish npm package through OIDC trusted publishing
        if: needs.validate.outputs.npm_exists != 'true'
        run: npm publish --provenance --access public
      - name: Publish JSR package through GitHub OIDC
        if: needs.validate.outputs.jsr_exists != 'true'
        id: jsr_publish
        run: |
          set -euo pipefail
          bun run jsr:build
          JSR_PUBLISH_LOG="$(mktemp)"
          bunx jsr@0.14.3 publish 2>&1 | tee "$JSR_PUBLISH_LOG"
          REKOR_URL="$(grep -Eo 'https://search\.sigstore\.dev/\?logIndex=[0-9]+' "$JSR_PUBLISH_LOG" | tail -n 1 || true)"
          REKOR_LOG_INDEX="${REKOR_URL##*=}"
          if ! [[ "$REKOR_LOG_INDEX" =~ ^[0-9]+$ ]]; then
            echo "::error::JSR publish did not report a Rekor transparency log index"
            exit 1
          fi
          echo "rekor_log_index=$REKOR_LOG_INDEX" >> "$GITHUB_OUTPUT"
      - name: Verify npm provenance and source identity
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          METADATA_FILE="$(mktemp)"
          NPM_ERROR="$(mktemp)"
          VERIFIED=0
          for attempt in {1..30}; do
            if npm view "$PACKAGE@$VERSION" --json >"$METADATA_FILE" 2>"$NPM_ERROR"; then
              if node - "$METADATA_FILE" "$VERSION" "$EXPECTED_SHA" <<'NODE'
          const fs = require("node:fs");
          const [metadataPath, expectedVersion, expectedSha] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          const metadata = Array.isArray(payload) ? payload[0] : payload;
          const predicateType = metadata?.dist?.attestations?.provenance?.predicateType;
          if (metadata?.version !== expectedVersion) {
            console.error(`npm returned version ${metadata?.version ?? "missing"}`);
            process.exit(1);
          }
          if (metadata?.gitHead !== expectedSha) {
            console.error(`npm gitHead ${metadata?.gitHead ?? "missing"} does not match ${expectedSha}`);
            process.exit(1);
          }
          if (predicateType !== "https://slsa.dev/provenance/v1") {
            console.error(`npm provenance predicate is ${predicateType ?? "missing"}`);
            process.exit(1);
          }
          NODE
              then
                VERIFIED=1
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::npm metadata did not prove version, source identity, and provenance"
              cat "$NPM_ERROR"
              exit 1
            fi
            sleep 10
          done
          test "$VERIFIED" -eq 1

          VERIFY_DIR="$(mktemp -d)"
          cd "$VERIFY_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE@$VERSION" --ignore-scripts --no-audit
          for attempt in {1..12}; do
            if npm audit signatures; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::npm audit signatures failed after retries: $PACKAGE@$VERSION"
              exit 1
            fi
            sleep 10
          done
      - name: Verify JSR provenance
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.candidate_sha }}
          REKOR_LOG_INDEX: ${{ steps.jsr_publish.outputs.rekor_log_index }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          JSR_URL="https://api.jsr.io/scopes/xsyetopz/packages/easel/versions/$VERSION"
          JSR_RESPONSE="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            "$JSR_URL" >"$JSR_RESPONSE"
          node - "$JSR_RESPONSE" "$VERSION" <<'NODE'
          const fs = require("node:fs");
          const [responsePath, expectedVersion] = process.argv.slice(2);
          const response = JSON.parse(fs.readFileSync(responsePath, "utf8"));
          if (response?.version !== expectedVersion) {
            console.error(`JSR returned version ${response?.version ?? "missing"}`);
            process.exit(1);
          }
          NODE

          REKOR_RESPONSE="$(mktemp)"
          if [[ "$REKOR_LOG_INDEX" =~ ^[0-9]+$ ]]; then
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 5 \
              "https://rekor.sigstore.dev/api/v1/log/entries?logIndex=$REKOR_LOG_INDEX" \
              >"$REKOR_RESPONSE"
          elif [ -z "$REKOR_LOG_INDEX" ]; then
            JSR_META="$(mktemp)"
            curl --fail --silent --show-error --location \
              "https://jsr.io/@xsyetopz/easel/${VERSION}_meta.json" >"$JSR_META"
            PACKAGE_SHA256="$(sha256sum "$JSR_META" | cut -d ' ' -f 1)"
            REKOR_UUIDS="$(mktemp)"
            curl --fail --silent --show-error --location \
              --header 'Content-Type: application/json' \
              --data "{\"hash\":\"sha256:$PACKAGE_SHA256\"}" \
              "https://rekor.sigstore.dev/api/v1/index/retrieve" >"$REKOR_UUIDS"
            REKOR_ENTRIES="$(mktemp -d)"
            node -e 'const fs=require("node:fs"); const ids=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(ids) || ids.length === 0) process.exit(1); process.stdout.write(ids.join("\n") + "\n")' "$REKOR_UUIDS" |
              while IFS= read -r rekor_uuid; do
                curl --fail --silent --show-error --location \
                  "https://rekor.sigstore.dev/api/v1/log/entries/$rekor_uuid" \
                  >"$REKOR_ENTRIES/$rekor_uuid.json"
              done
            node - "$REKOR_ENTRIES" "$REKOR_RESPONSE" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const [entriesDirectory, outputPath] = process.argv.slice(2);
          const response = Object.assign(
            {},
            ...fs.readdirSync(entriesDirectory).map((file) =>
              JSON.parse(fs.readFileSync(path.join(entriesDirectory, file), "utf8")),
            ),
          );
          fs.writeFileSync(outputPath, JSON.stringify(response));
          NODE
          else
            echo "::error::JSR publish produced an invalid Rekor transparency log index"
            exit 1
          fi
          node - "$REKOR_RESPONSE" "$REKOR_LOG_INDEX" "$VERSION" "$EXPECTED_SHA" <<'NODE'
          const fs = require("node:fs");
          const [responsePath, expectedIndex, expectedVersion, expectedSha] = process.argv.slice(2);
          const response = JSON.parse(fs.readFileSync(responsePath, "utf8"));
          const entries = Object.values(response);
          const expectedSubject = `pkg:jsr/@xsyetopz/easel@${expectedVersion}`;
          const decodeStatement = (entry) =>
            JSON.parse(Buffer.from(entry.attestation?.data ?? "", "base64").toString("utf8"));
          const entry = expectedIndex
            ? entries.find(({ logIndex }) => String(logIndex) === expectedIndex)
            : entries.find((candidate) => {
                const candidateStatement = decodeStatement(candidate);
                return candidateStatement.subject?.some(({ name }) => name === expectedSubject);
              });
          if (!entry) {
            console.error(expectedIndex ? `Rekor has no entry at log index ${expectedIndex}` : "Rekor has no entry for the JSR package digest");
            process.exit(1);
          }
          const statement = decodeStatement(entry);
          const subjectNames = statement.subject?.map(({ name }) => name) ?? [];
          if (!subjectNames.includes(expectedSubject)) {
            console.error(`Rekor provenance does not include ${expectedSubject}`);
            process.exit(1);
          }
          if (statement.predicateType !== "https://slsa.dev/provenance/v1") {
            console.error(`Rekor provenance predicate is ${statement.predicateType ?? "missing"}`);
            process.exit(1);
          }
          const dependencies = statement.predicate?.buildDefinition?.resolvedDependencies ?? [];
          const source = dependencies.find(({ uri }) => uri === "git+https://github.com/xsyetopz/easel.js@refs/heads/main");
          if (source?.digest?.gitCommit !== expectedSha) {
            console.error(`Rekor source commit ${source?.digest?.gitCommit ?? "missing"} does not match ${expectedSha}`);
            process.exit(1);
          }
          NODE

  github-release:
    name: Tag and create GitHub release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.candidate_sha }}
      - name: Assert release candidate and tag state
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "xsyetopz/easel.js" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::GitHub release job is not running on the protected release source"
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$CANDIDATE_SHA" ]; then
            echo "::error::GitHub release checkout does not match the published source"
            exit 1
          fi
          TAG_ERROR="$(mktemp)"
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/v$VERSION" >/dev/null 2>"$TAG_ERROR"
          TAG_STATUS=$?
          set -e
          case "$TAG_STATUS" in
            0)
              echo "::error::Tag already exists remotely: v$VERSION"
              exit 1
              ;;
            2)
              ;;
            *)
              echo "::error::Unable to prove tag is absent"
              cat "$TAG_ERROR"
              exit 1
              ;;
          esac
          RELEASE_ERROR="$(mktemp)"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" >/dev/null 2>"$RELEASE_ERROR"
          RELEASE_STATUS=$?
          set -e
          case "$RELEASE_STATUS" in
            0)
              echo "::error::GitHub release already exists: v$VERSION"
              exit 1
              ;;
            1)
              if ! grep -Eqi 'HTTP 404|Not Found' "$RELEASE_ERROR"; then
                echo "::error::Unable to prove GitHub release is absent"
                cat "$RELEASE_ERROR"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unable to prove GitHub release is absent"
              cat "$RELEASE_ERROR"
              exit 1
              ;;
          esac
      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --target "$CANDIDATE_SHA" \
            --title "v$VERSION" \
            --notes "Release v$VERSION" \
            --latest
