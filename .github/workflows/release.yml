name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix
        required: true
        type: string

run-name: Release ${{ inputs.version }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: lts/*

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2.2.0
      - name: Validate release state
        id: state
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got $VERSION"
            exit 1
          fi
          PACKAGE_VERSION=$(bun -p "require('./package.json').version")
          PACKAGE_NAME=$(bun -p "require('./package.json').name")
          JSR_VERSION=$(bun -p "require('./jsr.json').version")
          REVISION=$(bun -e "const fs=require('node:fs'); const match=fs.readFileSync('src/index.ts','utf8').match(/REVISION = \\\"([^\\\"]+)\\\"/); console.log(match?.[1] ?? '')")
          if [ "$PACKAGE_VERSION" != "$VERSION" ] || [ "$JSR_VERSION" != "$VERSION" ] || [ "$REVISION" != "$VERSION" ]; then
            echo "::error::Version mismatch package=$PACKAGE_VERSION jsr=$JSR_VERSION revision=$REVISION input=$VERSION"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag already exists locally: v$VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag already exists remotely: v$VERSION"
            exit 1
          fi
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "npm_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if bunx jsr show "$PACKAGE_NAME@$VERSION" >/dev/null 2>&1; then
            echo "jsr_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "jsr_exists=false" >> "$GITHUB_OUTPUT"
          fi
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - name: Publish npm package with provenance
        if: steps.state.outputs.npm_exists != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish JSR package
        if: steps.state.outputs.jsr_exists != 'true'
        run: bun run jsr:publish
      - name: Verify npm package provenance
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE=$(bun -p "require('./package.json').name")
          for attempt in {1..30}; do
            if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::npm package did not become visible: $PACKAGE@$VERSION"
              exit 1
            fi
            sleep 10
          done
          VERIFY_DIR=$(mktemp -d)
          cd "$VERIFY_DIR"
          npm init -y >/dev/null
          npm install "$PACKAGE@$VERSION" --ignore-scripts
          for attempt in {1..12}; do
            if npm audit signatures; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::npm audit signatures failed after retries: $PACKAGE@$VERSION"
              exit 1
            fi
            sleep 10
          done
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes "Release v$VERSION" --latest
