name: Question
description: Ask a focused usage or migration question.
title: "[Question]: "
labels: [question]
body:
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - API usage
        - THREE.js migration
        - Renderer constraints
        - Examples
        - Package / install
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask one focused question and include the code or page you are looking at.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the docs and examples first.
          required: true
        - label: I understand EASEL.js is CPU Canvas2D, not WebGL feature parity.
          required: true
