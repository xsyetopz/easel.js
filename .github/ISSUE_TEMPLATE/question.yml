name: Question
description: Ask about EASEL.js usage or migration.
title: "[Question]: "
labels: [question]
body:
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - API usage
        - THREE.js migration
        - Renderer constraints
        - Examples
        - Package / install
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include the relevant code or documentation page when available.
    validations:
      required: true
